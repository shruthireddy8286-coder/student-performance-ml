<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Section Comparison · Student ML Analytics</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/lib/chart.umd.js"></script>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Section Comparison</h1>
                <p>Compare risk and performance across departments/sections.</p>
            </div>
        </div>

        <div class="card">
            <h3>Average Poor-Risk Probability by Section</h3>
            <p class="small muted">Higher bars = that section needs more attention on average.</p>
            <canvas id="sectionChart" height="90"></canvas>
        </div>

        <div class="card mt-24">
            <h3>Full Breakdown</h3>
            <table class="mt-24">
                <thead>
                    <tr>
                        <th>Department</th><th>Section</th><th>Students</th>
                        <th>Good</th><th>Average</th><th>Poor</th>
                        <th>High Risk</th><th>Avg Attendance</th>
                    </tr>
                </thead>
                <tbody id="sectionTableBody">
                    <tr><td colspan="8" class="muted">Loading…</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script src="js/common.js"></script>
<script src="js/section_comparison.js"></script>
</body>
</html>
