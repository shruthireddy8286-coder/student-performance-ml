<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login · Student ML Analytics</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="brand-lockup"><span class="dot"></span>
            <span style="font-family:'Sora',sans-serif;font-weight:800;font-size:16px;">Student ML Analytics</span>
        </div>
        <h2 style="margin-top:18px;">Teacher / Admin Login</h2>
        <p class="muted small">Sign in to view predictions, at-risk students and analytics.</p>

        <form id="loginForm">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button class="btn full mt-24" type="submit">Log in</button>
        </form>
        <div class="error-msg" id="errorMsg"></div>

        <p class="small muted mt-24">
            Default demo login — username: <strong>admin</strong>, password: <strong>admin123</strong>
        </p>
    </div>
</div>

<script src="js/common.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("errorMsg");
    errorEl.style.display = "none";
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
        const data = await api("login.php", { method: "POST", body: { username, password } });
        sessionStorage.setItem("username", data.username);
        window.location.href = "dashboard.html";
    } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
    }
});
</script>
</body>
</html>
